set_channels:
  name: Set color channels
  description: Set one or more Fluval light color channels, optionally ramping over time.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    red:
      name: Channel 1 (Red / Rose)
      description: Channel 1 intensity, 0-100%. AquaSky and Plant Pro use Red; classic Plant/Marine uses Rose.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      name: Channel 2 (Green / Blue)
      description: Channel 2 intensity, 0-100%. AquaSky uses Green; Plant/Marine and Plant Pro use Blue.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      name: Channel 3 (Blue / Cool White)
      description: Channel 3 intensity, 0-100%. AquaSky uses Blue; Plant-family profiles use Cool/Cold White.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      name: Channel 4 (White)
      description: Channel 4 intensity, 0-100%. AquaSky uses White; Plant profiles use Pure or Warm White.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    channel_5:
      name: Channel 5 (Warm White / Amber)
      description: Optional channel 5 intensity, 0-100%. Classic Plant/Marine uses Warm White; Plant Pro uses Amber.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: Ramp duration in seconds.
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between writes during a ramp.
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

preview_schedule:
  name: Preview schedule
  description: Physically preview a 24-hour Fluval channel schedule compressed into a short duration.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: List of points with time plus red, green, blue, white, and optional channel_5 values.
      required: true
      example:
        - time: "10:00"
          red: 0
          green: 0
          blue: 0
          white: 0
        - time: "11:00"
          red: 10
          green: 10
          blue: 25
          white: 5
      selector:
        object:
    duration:
      name: Preview duration
      description: Number of seconds to compress the 24-hour preview into.
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    step_seconds:
      name: Step seconds
      description: Seconds between preview writes.
      default: 2
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s

stop_preview:
  name: Stop preview
  description: Stop a running physical schedule preview.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:

save_schedule:
  name: Save schedule
  description: Save a Fluval 24-hour channel schedule and HA schedule mode for dashboard cards.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: List of schedule points with time plus red, green, blue, white, and optional channel_5 values.
      required: true
      example:
        - time: "10:00"
          red: 0
          green: 0
          blue: 0
          white: 0
        - time: "11:00"
          red: 10
          green: 10
          blue: 25
          white: 5
      selector:
        object:
    mode:
      name: Schedule mode
      description: Manual saves only. Auto has Home Assistant apply values every minute. Native uploads 2-12 points once and lets the fixture run its own clock.
      selector:
        select:
          options:
            - manual
            - auto
            - native

set_native_auto_schedule:
  name: Set native Auto schedule
  description: Write the controller's native Auto sunrise/sunset schedule using the classic, FACEBD, or Plant Pro protocol.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    sunrise:
      name: Sunrise
      description: Object with hour, minute, and ramp duration from 0 to 240 minutes.
      required: true
      example:
        hour: 8
        minute: 0
        ramp: 60
      selector:
        object:
    sunset:
      name: Sunset
      description: Object with hour, minute, and ramp duration from 0 to 240 minutes; this is when ramp-down finishes.
      required: true
      example:
        hour: 21
        minute: 0
        ramp: 60
      selector:
        object:
    sleep:
      name: Sleep
      description: Optional object with hour and minute for full off; omit/null to disable sleep-off.
      example:
        hour: 22
        minute: 30
      selector:
        object:
    day_levels:
      name: Day levels
      description: Channel levels from 0-100. AquaSky uses channels 1-4; channel 5 is ignored.
      required: true
      example:
        channel_1: 80
        channel_2: 80
        channel_3: 80
        channel_4: 80
        channel_5: 80
      selector:
        object:
    night_levels:
      name: Night levels
      description: Channel levels from 0-100. AquaSky uses channels 1-4; channel 5 is ignored.
      required: true
      example:
        channel_1: 0
        channel_2: 10
        channel_3: 0
        channel_4: 0
        channel_5: 0
      selector:
        object:
    activate:
      name: Activate Auto mode
      description: Switch the fixture to Auto after writing the schedule.
      default: true
      selector:
        boolean:

set_native_pro_schedule:
  name: Set native Professional schedule
  description: Write native Professional schedule points using the classic, FACEBD, or Plant Pro protocol.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID when more than one Fluval light is configured.
      selector:
        text:
    mac:
      name: MAC address
      description: Optional Bluetooth MAC address when more than one Fluval light is configured.
      selector:
        text:
    points:
      name: Schedule points
      description: Two to 12 points with time plus channel_1 through channel_5. AquaSky ignores channel_5; Plant Pro order is Red, Blue, Cool White, Warm White, Amber.
      required: true
      example:
        - time: "08:00"
          channel_1: 0
          channel_2: 0
          channel_3: 0
          channel_4: 0
          channel_5: 0
        - time: "12:00"
          channel_1: 60
          channel_2: 60
          channel_3: 60
          channel_4: 60
          channel_5: 60
      selector:
        object:
    activate:
      name: Activate Pro mode
      description: Switch the fixture to Professional after writing the schedule.
      default: true
      selector:
        boolean:
