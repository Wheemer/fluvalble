name: CI

on:
  push:
    # CI runs on stable and active work branches so problems are caught before
    # merging. Pull requests targeting stable are always covered below.
    branches: [master, main, "feature/**", "fix/**", "build/**", "docs/**", "chore/**", "release/**"]
  pull_request:
    # All PRs must pass CI regardless of their target branch.
    branches: [master, main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked development dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff (linter + formatter check)
        run: |
          ruff check custom_components/ tests/

  # -----------------------------------------------------------------------
  # Validate manifest.json
  # -----------------------------------------------------------------------
  validate-manifest:
    name: Validate manifest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check manifest.json is valid JSON
        run: python -c "import json; json.load(open('custom_components/fluvalble/manifest.json'))"

      - name: Check required manifest fields
        run: |
          python - <<'EOF'
          import json, sys
          manifest = json.load(open("custom_components/fluvalble/manifest.json"))
          required = ["domain", "name", "version", "codeowners", "documentation",
                      "issue_tracker", "iot_class", "requirements", "loggers"]
          missing = [f for f in required if f not in manifest]
          if missing:
              print(f"Missing manifest fields: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"manifest.json OK — version {manifest['version']}")
          EOF

  # -----------------------------------------------------------------------
  # Validate strings / translations
  # -----------------------------------------------------------------------
  validate-translations:
    name: Validate translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check strings.json is valid JSON
        run: python -c "import json; json.load(open('custom_components/fluvalble/strings.json'))"

      - name: Check translations/en.json is valid JSON
        run: python -c "import json; json.load(open('custom_components/fluvalble/translations/en.json'))"

      - name: Check en.json keys match strings.json top-level sections
        run: |
          python - <<'EOF'
          import json, sys
          strings = json.load(open("custom_components/fluvalble/strings.json"))
          en = json.load(open("custom_components/fluvalble/translations/en.json"))
          missing = set(strings.keys()) - set(en.keys())
          if missing:
              print(f"Sections in strings.json missing from en.json: {missing}", file=sys.stderr)
              sys.exit(1)
          print("Translation keys OK")
          EOF

  # -----------------------------------------------------------------------
  # Unit tests
  # -----------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Static type checking (soft, non-gating)
  # -----------------------------------------------------------------------
  mypy:
    name: mypy (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked development dependencies
        run: pip install -r requirements.txt

      - name: Run mypy
        # HA's runtime types are not installable in CI; we type-check against
        # the integration's own modules only. This is a soft, non-gating pass:
        # existing type errors are reported in the job log so we can see
        # progress as the integration gains type hints, but they don't fail
        # the build. `|| true` makes the exit-code-0-on-failure explicit.
        # Tighten this gradually — see `pyproject.toml` `[tool.mypy]` and
        # `docs/bug-triage.md`.
        run: |
          mypy custom_components/fluvalble/ \
            --ignore-missing-imports \
            --no-implicit-optional \
            --warn-unused-ignores \
            --warn-redundant-casts \
            || true

  # -----------------------------------------------------------------------
  # Test coverage
  # -----------------------------------------------------------------------
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked development dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=custom_components/fluvalble \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Set the repository's CODECOV_TOKEN secret to enable uploads.
        # The job degrades gracefully if the token is missing.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # -----------------------------------------------------------------------
  # HACS validation
  # -----------------------------------------------------------------------
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # Full HACS publication validation requires repository-level metadata
    # (topics, public listing state) that fork/PR CI cannot guarantee. Keep it
    # on stable branch pushes; PRs still validate manifest and hacs.json shape.
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
