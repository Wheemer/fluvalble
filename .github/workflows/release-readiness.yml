name: Release readiness

# Extra validation for release branches targeting the stable branch. Checks that
# the manifest version is clean semver and has a CHANGELOG entry, then runs the
# full suite so the merge commit can be tagged immediately.

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  promotion-checks:
    name: Promotion readiness
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifest version is semver
        run: |
          python - <<'EOF'
          import json, re, sys
          manifest = json.load(open("custom_components/fluvalble/manifest.json"))
          version = manifest.get("version", "")
          if not re.match(r"^\d+\.\d+\.\d+$", version):
              print(f"::error::manifest.json version '{version}' is not valid semver (X.Y.Z)", file=sys.stderr)
              sys.exit(1)
          print(f"Version OK: {version}")
          EOF

      - name: Check CHANGELOG has entry for this version
        run: |
          python - <<'EOF'
          import json, sys
          version = json.load(open("custom_components/fluvalble/manifest.json"))["version"]
          changelog = open("CHANGELOG.md").read()
          if f"[{version}]" not in changelog:
              print(f"::error::No CHANGELOG.md entry found for version {version}", file=sys.stderr)
              print(f"::error::Add a section '## [{version}] - YYYY-MM-DD' before merging.", file=sys.stderr)
              sys.exit(1)
          print(f"CHANGELOG entry found for {version}")
          EOF

      - name: Run full test suite one more time
        run: |
          pip install -r requirements.txt --quiet
          python -m pytest tests/ -v --tb=short
